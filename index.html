<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0A6A80">
<title>Hành Trang Hôm Nay</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Be+Vietnam+Pro:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap&subset=vietnamese">
<style>
:root {
  --bg:#EAF1F4; --surface:#FFFFFF; --sunk:#DCE7EC; --ink:#10232D; --muted:#566E7A; --line:#CCDAE1;
  --sea:#0A6A80; --sea-soft:#D2EBF0; --now:#E5560B; --now-soft:#FDE6D8; --ai:#7A4FC9; --ai-soft:#EEE6FB;
  --c-move:#5868C8; --c-food:#C2410C; --c-cafe:#8B5A2B; --c-sight:#0A6A80; --c-hotel:#6B7280; --c-act:#9D3C8F; --c-free:#4D7C0F;
  --f-display:"Bricolage Grotesque","Be Vietnam Pro",system-ui,sans-serif;
  --f-body:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,"SF Mono",Menlo,monospace;
  color-scheme:light;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg:#0A151B; --surface:#122129; --sunk:#0E1B22; --ink:#E3EEF2; --muted:#8EA6B1; --line:#22363F;
    --sea:#52B9D0; --sea-soft:#123542; --now:#FF8A3D; --now-soft:#3A2214; --ai:#B79AF0; --ai-soft:#2A2140;
    --c-move:#8C98F0; --c-food:#F08A55; --c-cafe:#D3A06E; --c-sight:#52B9D0; --c-hotel:#9CA3AF; --c-act:#D47BC6; --c-free:#9BC75A;
    color-scheme:dark;
  }
}
* { box-sizing:border-box; }
html, body { margin:0; }
body {
  background:var(--bg); color:var(--ink); font-family:var(--f-body); font-size:15px; line-height:1.5;
  padding-left:max(14px, env(safe-area-inset-left, 0px)); padding-right:max(14px, env(safe-area-inset-right, 0px));
  padding-block:0 96px; -webkit-text-size-adjust:100%;
}
.wrap { max-width:1080px; margin:0 auto; }
h1,h2,h3,h4 { font-family:var(--f-display); text-wrap:balance; margin:0; line-height:1.15; }
button,input,textarea,select { font:inherit; color:inherit; }
button { cursor:pointer; -webkit-tap-highlight-color:transparent; }
:focus-visible { outline:2px solid var(--now); outline-offset:2px; }
a { color:var(--sea); }
.mono { font-family:var(--f-mono); font-variant-numeric:tabular-nums; }
.label { font-size:11px; letter-spacing:.09em; text-transform:uppercase; color:var(--muted); font-weight:600; }
.sub { font-size:12.5px; color:var(--muted); }

/* Hình nền & Hiệu ứng kính */
#ambient-bg { position:fixed; inset:0; width:100vw; height:100vh; z-index:-2; pointer-events:none; overflow:hidden; }
#ambient-bg svg { width:100%; height:100%; object-fit:cover; display:block; }
#ambient-veil { position:fixed; inset:0; z-index:-1; pointer-events:none; background:linear-gradient(180deg, rgba(234,241,244,0.25) 0%, rgba(234,241,244,0.85) 60%, var(--bg) 100%); }
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) #ambient-veil { background:linear-gradient(180deg, rgba(10,21,27,0.35) 0%, rgba(10,21,27,0.88) 60%, var(--bg) 100%); }
}
.hero, .panel, .card {
  background:color-mix(in srgb, var(--surface) 92%, transparent) !important;
  backdrop-filter:blur(16px) saturate(160%); -webkit-backdrop-filter:blur(16px) saturate(160%);
  border:1px solid color-mix(in srgb, var(--line) 80%, transparent) !important;
  box-shadow:0 8px 32px 0 rgba(16, 35, 45, 0.05);
}
.top {
  position:sticky; top:env(safe-area-inset-top,0px); z-index:20;
  background:color-mix(in srgb, var(--bg) 80%, transparent) !important;
  backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px);
  display:flex; gap:10px; align-items:center; justify-content:space-between;
  padding-block:12px 10px; border-bottom:1px solid var(--line);
}
.nav {
  position:fixed; left:0; right:0; bottom:0; z-index:25;
  background:color-mix(in srgb, var(--surface) 85%, transparent) !important;
  backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px);
  border-top:1px solid var(--line); display:flex; justify-content:center;
  padding:6px max(8px, env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px, env(safe-area-inset-left,0px));
}

.brand { min-width:0; }
.brand .k { font-family:var(--f-display); font-weight:800; font-size:12.5px; color:var(--sea); letter-spacing:.02em; }
.brand h1 { font-size:19px; font-weight:800; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.actions { display:flex; gap:6px; flex:none; }
.btn { border:1px solid var(--line); background:var(--surface); border-radius:999px; padding:8px 14px; font-size:13.5px; font-weight:600; min-height:38px; }
.btn:hover { border-color:var(--sea); }
.btn.primary { background:var(--sea); border-color:var(--sea); color:var(--surface); }
.btn.now { background:var(--now); border-color:var(--now); color:#fff; }
.btn.sm { padding:5px 11px; min-height:32px; font-size:12.5px; }
.who { display:flex; align-items:center; gap:6px; border:1px solid var(--line); background:var(--surface); border-radius:999px; padding:4px 10px 4px 4px; font-size:13px; font-weight:600; min-height:38px; max-width:44vw; }
.who span:last-child { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.av { flex:none; width:28px; height:28px; border-radius:50%; background:var(--sea); color:var(--surface); display:grid; place-items:center; font-family:var(--f-display); font-weight:800; font-size:12.5px; }

/* Hero */
.hero { margin-top:14px; border-radius:20px; padding:18px; display:grid; gap:12px; }
.hero .meta { display:flex; justify-content:space-between; gap:10px; flex-wrap:wrap; align-items:baseline; }
.hero .clock { font-family:var(--f-mono); font-weight:700; font-size:15px; }
.hero .loc { font-size:12.5px; color:var(--muted); }
.hero h2 { font-size:clamp(23px,6vw,32px); font-weight:800; }
.hero .place { color:var(--muted); font-size:14px; }
.cd { display:flex; gap:6px; align-items:flex-end; flex-wrap:wrap; }
.cd .u { display:grid; justify-items:center; background:var(--now-soft); border-radius:12px; padding:8px 10px 6px; min-width:62px; }
.cd .u b { font-family:var(--f-mono); font-size:clamp(28px,9vw,40px); line-height:1; color:var(--now); font-variant-numeric:tabular-nums; }
.cd .u span { font-size:10.5px; letter-spacing:.08em; text-transform:uppercase; color:var(--muted); margin-top:4px; font-weight:600; }
.bar { height:7px; background:var(--sunk); border-radius:7px; overflow:hidden; }
.bar i { display:block; height:100%; background:var(--now); border-radius:7px; transition:width .6s; }
.barmeta { display:flex; justify-content:space-between; font-size:12px; color:var(--muted); }
.notes { margin:0; padding:0; list-style:none; display:grid; gap:6px; }
.notes li { font-size:14px; padding-left:16px; position:relative; }
.notes li::before { content:""; position:absolute; left:2px; top:.62em; width:6px; height:6px; border-radius:2px; background:var(--now); }
.notes li.ai::before { background:var(--ai); }
.tag { display:inline-block; font-size:10px; font-weight:700; letter-spacing:.05em; text-transform:uppercase; border-radius:5px; padding:1px 6px; vertical-align:1px; margin-left:4px; }
.tag.ai { color:var(--ai); background:var(--ai-soft); }

/* Card gợi ý 1km */
.spotlight-card {
  background: color-mix(in srgb, var(--surface) 94%, transparent);
  border: 1px solid color-mix(in srgb, var(--now) 40%, transparent) !important;
  border-radius: 18px;
  padding: 16px;
  margin-top: 14px;
  display: grid;
  gap: 8px;
}
.spotlight-card .hd { display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
.spotlight-card .spot-badge { font-size: 11px; font-weight: 700; color: var(--now); background: var(--now-soft); padding: 3px 8px; border-radius: 999px; text-transform: uppercase; }
.spotlight-card ul { margin: 4px 0 0; padding-left: 18px; font-size: 13.5px; }
.spotlight-card ul li { margin-bottom: 4px; }
.photo-tip { font-size: 12px; color: var(--now); background: var(--now-soft); padding: 4px 8px; border-radius: 6px; margin-top: 4px; display: inline-block; }

/* Layout Grid */
.grid { display:grid; grid-template-columns:minmax(0,1.1fr) minmax(0,1fr); gap:16px; margin-top:16px; }
@media (max-width:900px){ .grid { grid-template-columns:1fr; } }
.col { display:grid; gap:16px; align-content:start; min-width:0; }
.panel { border-radius:18px; padding:16px; min-width:0; scroll-margin-top:80px; }
.panel>header { display:flex; justify-content:space-between; align-items:baseline; gap:10px; margin-bottom:10px; flex-wrap:wrap; }
.panel h3 { font-size:17.5px; font-weight:800; }

/* Activities */
.acts { display:grid; }
.act { display:grid; grid-template-columns:58px minmax(0,1fr) auto; gap:10px; align-items:start; padding:11px 0; border-top:1px solid var(--line); background:none; border-left:0; border-right:0; border-bottom:0; text-align:left; width:100%; }
.act:first-child { border-top:0; padding-top:2px; }
.act .when { font-family:var(--f-mono); font-weight:700; font-size:15px; }
.act .rel { font-size:11px; color:var(--now); font-weight:600; line-height:1.3; }
.act.past .rel { color:var(--muted); }
.act h4 { font-family:var(--f-body); font-size:15px; font-weight:600; }
.act .pl { font-size:13px; color:var(--muted); }
.act .q { font-size:13px; margin-top:4px; color:var(--ink); background:var(--sunk); border-radius:8px; padding:5px 8px; }
.act .q b { font-weight:600; }
.cnt { font-size:11.5px; font-weight:700; color:var(--sea); background:var(--sea-soft); border-radius:999px; padding:2px 8px; white-space:nowrap; }
.chip { display:inline-block; font-size:10px; font-weight:700; letter-spacing:.04em; text-transform:uppercase; padding:1px 6px; border-radius:999px; border:1px solid currentColor; margin-right:6px; vertical-align:2px; }
.t-move{color:var(--c-move)}.t-food{color:var(--c-food)}.t-cafe{color:var(--c-cafe)}.t-sight{color:var(--c-sight)}.t-hotel{color:var(--c-hotel)}.t-act{color:var(--c-act)}.t-free{color:var(--c-free)}
.empty { font-size:14px; color:var(--muted); padding:4px 0; }

/* Ghi chú nhóm */
.compose { display:grid; gap:8px; margin-bottom:12px; }
.compose select, .compose textarea, .field input, .field textarea { width:100%; border:1px solid var(--line); border-radius:12px; background:var(--bg); padding:10px 12px; font-size:15px; }
.compose textarea { min-height:72px; resize:vertical; }
.row { display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
.feed { list-style:none; margin:0; padding:0; display:grid; gap:10px; }
.note { display:grid; grid-template-columns:28px minmax(0,1fr); gap:10px; }
.note .bd { background:var(--sunk); border-radius:4px 14px 14px 14px; padding:8px 11px; min-width:0; }
.note .hd { font-size:12px; color:var(--muted); display:flex; gap:6px; flex-wrap:wrap; justify-content:space-between; }
.note .hd b { color:var(--ink); }
.note .tx { font-size:14.5px; white-space:pre-wrap; overflow-wrap:anywhere; }

/* Timeline & Thời tiết ngày */
.tabs { display:flex; gap:6px; overflow-x:auto; padding-bottom:4px; margin-bottom:10px; scrollbar-width:thin; }
.tab { border:1px solid var(--line); background:transparent; border-radius:999px; padding:6px 12px; font-size:13px; white-space:nowrap; min-height:34px; }
.tab[aria-pressed="true"] { background:var(--ink); border-color:var(--ink); color:var(--surface); }
.day-weather-banner { background:var(--sea-soft); border-radius:12px; padding:8px 12px; margin-bottom:12px; display:flex; align-items:center; gap:10px; font-size:13px; color:var(--sea); }
.day-weather-banner b { color:var(--ink); }
.tl { list-style:none; margin:0; padding:0; position:relative; }
.tl::before { content:""; position:absolute; left:57px; top:8px; bottom:8px; width:2px; background:var(--line); }
.ti button { display:grid; grid-template-columns:46px 20px minmax(0,1fr); gap:6px; padding:8px 0; width:100%; background:none; border:0; text-align:left; }
.ti .tm { font-family:var(--f-mono); font-size:13px; text-align:right; padding-top:1px; }
.ti .dot { width:12px; height:12px; border-radius:50%; background:var(--surface); border:2px solid currentColor; margin:4px auto 0; position:relative; z-index:1; }
.ti.cur .dot { background:var(--now); border-color:var(--now); box-shadow:0 0 0 4px var(--now-soft); }
.nowline { display:grid; grid-template-columns:46px 20px 1fr; gap:6px; align-items:center; padding:2px 0; }
.nowline .tm { font-family:var(--f-mono); font-size:12px; font-weight:700; color:var(--now); text-align:right; }
.nowline .dot { width:10px; height:10px; border-radius:50%; background:var(--now); margin:0 auto; z-index:1; animation:pulse 2s infinite; }
.nowline .ln { height:2px; background:var(--now); position:relative; }
.nowline .ln span { position:absolute; right:0; top:-9px; font-size:10px; font-weight:700; color:var(--now); background:var(--surface); padding-left:6px; }
@keyframes pulse { 0%{box-shadow:0 0 0 0 var(--now-soft)} 70%{box-shadow:0 0 0 8px transparent} 100%{box-shadow:0 0 0 0 transparent} }

/* Quanh đây 2km */
.seg { display:flex; background:var(--sunk); border-radius:12px; padding:3px; gap:3px; margin-bottom:10px; }
.seg button { flex:1; border:0; background:transparent; border-radius:9px; padding:7px 4px; font-size:13px; font-weight:600; color:var(--muted); min-height:34px; }
.seg button[aria-pressed="true"] { background:var(--surface); color:var(--ink); }
.pl-list { list-style:none; margin:0; padding:0; }
.pl-list li { display:grid; grid-template-columns:minmax(0,1fr) auto; gap:10px; padding:9px 0; border-top:1px solid var(--line); }
.pl-list li:first-child { border-top:0; }
.pl-list a { font-weight:600; text-decoration:none; color:var(--ink); }
.pl-list a:hover { color:var(--sea); text-decoration:underline; }
.pl-list .why { font-size:12.5px; color:var(--muted); }
.pl-list .km { font-family:var(--f-mono); font-size:12px; color:var(--sea); white-space:nowrap; }

/* Kho ảnh & Chi phí */
.album-grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(130px, 1fr)); gap:10px; margin-top:10px; }
.photo-card { border-radius:12px; overflow:hidden; background:var(--sunk); border:1px solid var(--line); display:flex; flex-direction:column; }
.photo-card img { width:100%; aspect-ratio:1; object-fit:cover; display:block; cursor:pointer; }
.photo-card .cap { padding:6px 8px; font-size:12px; line-height:1.3; }
.photo-card .cap b { display:block; color:var(--ink); font-size:11px; }

.total { display:flex; justify-content:space-between; align-items:flex-end; gap:12px; flex-wrap:wrap; margin-bottom:12px; }
.total .big { font-family:var(--f-display); font-weight:800; font-size:30px; line-height:1; }
.total .big small { font-family:var(--f-body); font-size:13px; font-weight:600; color:var(--muted); margin-left:4px; }
.exps { list-style:none; margin:0; padding:0; }
.exp { display:grid; grid-template-columns:48px minmax(0,1fr) auto; gap:10px; align-items:center; padding:9px 0; border-top:1px solid var(--line); }
.exp:first-child { border-top:0; }
.thumb { width:48px; height:48px; border-radius:10px; background:var(--sunk); border:1px solid var(--line); display:grid; place-items:center; overflow:hidden; color:var(--muted); font-size:10px; font-weight:600; }
.thumb img { width:100%; height:100%; object-fit:cover; display:block; }
.exp .amt { text-align:right; font-family:var(--f-mono); font-weight:700; font-size:14px; white-space:nowrap; }

/* Thời tiết widget */
.wx-now { display:flex; gap:14px; align-items:center; flex-wrap:wrap; }
.wx-now .deg { font-family:var(--f-display); font-size:46px; font-weight:800; line-height:1; }
.wx-now svg { width:50px; height:50px; flex:none; }
.wx-meta { font-size:13px; color:var(--muted); }
.hours { display:grid; grid-template-columns:repeat(5,minmax(0,1fr)); gap:6px; margin-top:12px; }
.hr { background:var(--sunk); border-radius:10px; padding:8px 2px; text-align:center; font-size:12px; }
.hr svg { width:26px; height:26px; display:block; margin:4px auto; }

/* Nav, Scrim & Sheet */
.nav .in { display:grid; grid-template-columns:repeat(5,1fr); gap:4px; width:100%; max-width:520px; }
.nav a { display:grid; justify-items:center; gap:2px; text-decoration:none; color:var(--muted); font-size:11.5px; font-weight:600; padding:4px 0; border-radius:10px; }
.nav svg { width:22px; height:22px; fill:none; stroke:currentColor; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round; }
.scrim { position:fixed; inset:0; background:rgba(6,16,22,.5); z-index:40; display:flex; align-items:flex-end; justify-content:center; }
.sheet { background:var(--surface); width:100%; max-width:640px; max-height:88vh; overflow:auto; border-radius:22px 22px 0 0; padding:8px max(16px, env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(16px, env(safe-area-inset-left,0px)); }
.grip { width:40px; height:5px; border-radius:5px; background:var(--line); margin:4px auto 10px; }
.x { border:0; background:var(--sunk); border-radius:50%; width:34px; height:34px; flex:none; font-size:18px; line-height:1; }
.toast { position:fixed; left:50%; bottom:calc(84px + env(safe-area-inset-bottom,0px)); transform:translateX(-50%); background:var(--ink); color:var(--surface); padding:9px 16px; border-radius:999px; font-size:14px; z-index:60; max-width:90vw; }
.foot { margin-top:18px; display:flex; gap:8px; flex-wrap:wrap; align-items:center; justify-content:center; font-size:12.5px; color:var(--muted); }
.foot input { border:1px solid var(--line); background:var(--surface); border-radius:8px; padding:4px 8px; font-size:12.5px; }
</style>
</head>
<body>
<div id="ambient-bg"></div>
<div id="ambient-veil"></div>
<div id="app"></div>

<script>
/* =========================================================
   CẤU HÌNH: Dán Web App URL của Google Apps Script vào đây.
   ========================================================= */
const API_URL = 'https://script.google.com/macros/s/AKfycbwMml1-KSkJKfANq7rLsaeBEJP3fTWQm6q-aecuBQicCl7XWPAn6VJHkd-QsHlx_5HE/exec';

(function(){
"use strict";
const IS_DEMO = !API_URL;
const $ = (s, r=document) => r.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const store = { get: k => { try { return localStorage.getItem(k); } catch(e){ return null; } }, set: (k,v) => { try { localStorage.setItem(k,v); } catch(e){} }, del: k => { try { localStorage.removeItem(k); } catch(e){} } };

const TYPES = { move:['Di chuyển','t-move'], food:['Ăn uống','t-food'], cafe:['Cà phê','t-cafe'], sight:['Tham quan','t-sight'], hotel:['Nghỉ ngơi','t-hotel'], activity:['Hoạt động','t-act'], free:['Tự do','t-free'] };
const typeOf = t => TYPES[t] || TYPES.activity;
const DOW = ['CN','T2','T3','T4','T5','T6','T7'];
const EXP_CATS = ['Ăn uống','Di chuyển','Lưu trú','Vé tham quan','Mua sắm','Khác'];
const CURS = ['VND','USD','EUR','JPY','KRW','THB','SGD','CNY','HKD','TWD','MYR','AUD','GBP'];
const nf = new Intl.NumberFormat('vi-VN');
const fmtMoney = (v,c) => nf.format(['VND','JPY','KRW'].includes(c) ? Math.round(v) : Math.round(v*100)/100) + ' ' + c;

function wallParts(date, tz) {
  let f; try { f = new Intl.DateTimeFormat('en-CA', { timeZone: tz, year:'numeric', month:'2-digit', day:'2-digit', hour:'2-digit', minute:'2-digit', second:'2-digit', hourCycle:'h23' }); }
  catch(e) { f = new Intl.DateTimeFormat('en-CA', { year:'numeric', month:'2-digit', day:'2-digit', hour:'2-digit', minute:'2-digit', second:'2-digit', hourCycle:'h23' }); }
  const p = {}; f.formatToParts(date).forEach(x => p[x.type] = x.value);
  return { date: `${p.year}-${p.month}-${p.day}`, time: `${p.hour==='24'?'00':p.hour}:${p.minute}`, sec: +p.second || 0 };
}
const toKey = (d,t) => { const [y,m,dd] = d.split('-').map(Number); const [h,mi] = (t||'00:00').split(':').map(Number); return Date.UTC(y,m-1,dd,h||0,mi||0)/60000; };
const fromKey = k => { const s = new Date(Math.floor(k)*60000).toISOString(); return { date: s.slice(0,10), time: s.slice(11,16) }; };
const addDays = (d,n) => { const [y,m,dd] = d.split('-').map(Number); return new Date(Date.UTC(y,m-1,dd+n)).toISOString().slice(0,10); };

function rel(min) { min = Math.round(min); if (min < 1) return 'sắp bắt đầu'; if (min < 60) return `sau ${min} phút`; const h = Math.floor(min/60), m = min%60; if (h < 24) return `sau ${h} giờ${m?' '+m+'p':''}`; return `sau ${Math.round(h/24)} ngày`; }
function ago(min) { min = Math.round(min); if (min < 1) return 'vừa xong'; if (min < 60) return `${min} phút trước`; const h = Math.floor(min/60); if (h < 24) return `${h} giờ trước`; return `${Math.round(h/24)} ngày trước`; }

async function apiGet(params) {

async function apiPost(body) {

  const j = await r.json(); if (j.error) throw new Error(j.error); return j;

function flat(trip) {
  const out = [];
  (trip.days||[]).forEach((d, di) => (d.items||[]).forEach((it, ii) => {
    const s = toKey(d.date, it.start);
    let e = it.end ? toKey(d.date, it.end) : null;
    if (e !== null && e <= s) e += 1440;
    out.push(Object.assign({}, it, { date: d.date, di, ii, s, e }));
  }));
  out.sort((a,b) => a.s - b.s);
  out.forEach((x, i) => { if (x.e === null) { const n = out[i+1]; x.e = n ? Math.min(n.s, x.s+120) : x.s+90; } });
  return out;
}
function nowExact() {
  if (S.simKey !== null) return S.simKey;
  const w = wallParts(new Date(), tz());
  return toKey(w.date, w.time) + w.sec/60;
}
function situation() {
  const items = flat(S.trip), n = nowExact();
  const cur = items.find(x => x.s <= n && n < x.e) || null;
  const next = items.filter(x => x.s > n).slice(0, 5);
  const past = items.filter(x => x.e <= n).reverse().slice(0, 5);
  const first = items[0], last = items[items.length-1];
  const phase = !first ? 'empty' : n < first.s ? 'before' : n >= last.e ? 'after' : 'during';
  return { items, n, cur, next, past, phase };
}
const itemById = id => { if (!S.trip) return null; for (const d of S.trip.days) for (const it of d.items) if (it.id === id) return Object.assign({ date: d.date }, it); return null; };
const notesFor = id => S.notes.filter(n => n.itemId === id).sort((a,b) => a.ts - b.ts);
function withIds(trip) {

  }));
  return trip;
}

function km(a,b,c,d) {
  const R=6371, r=x=>x*Math.PI/180;
  const dl=r(c-a), dn=r(d-b);
  return 2*R*Math.asin(Math.sqrt(Math.sin(dl/2)**2 + Math.cos(r(a))*Math.cos(r(c))*Math.sin(dn/2)**2));
}

function locate() {
  return new Promise(res => {
    if (!navigator.geolocation) return res(null);
    let done = false; const t = setTimeout(() => { if (!done) { done = true; res(null); } }, 6000);
    navigator.geolocation.getCurrentPosition(
      p => { if (done) return; done = true; clearTimeout(t); res({ lat: p.coords.latitude, lng: p.coords.longitude, src: 'gps', name: 'vị trí của anh/chị' }); },
      () => { if (done) return; done = true; clearTimeout(t); res(null); },
      { enableHighAccuracy: true, timeout: 5500, maximumAge: 120000 }
    );
  });
}
function planLoc(sit) {
  const a = sit.cur || sit.next[0] || sit.past[0] || sit.items[0];
  return a && a.lat != null && a.lng != null ? { lat: +a.lat, lng: +a.lng, src: 'plan', name: a.place || a.title } : null;
}

/* ==================== HÌNH NỀN ADAPTIVE (NGHỆ THUẬT ĐỘNG) ==================== */
function detectLandscapeProfile(placeName, destination) {
  const s = ((placeName || '') + ' ' + (destination || '')).toLowerCase();
  if (/biển|mỹ khê|sơn trà|hạ long|nha trang|phú quốc|đảo|bãi|vịnh|beach|sea|coast/.test(s)) return 'beach';
  if (/bà nà|núi|đà lạt|sapa|ngũ hành sơn|hà giang|đèo|hills|mountain|peak|rừng/.test(s)) return 'mountain';
  if (/hội an|huế|chùa|chùa cầu|phố cổ|cố đô|lăng|thành cổ|đền|heritage|ancient/.test(s)) return 'heritage';
  if (/hà nội|sài gòn|tp\.hcm|hồ chí minh|chợ bến thành|singapore|tokyo|city|trần phú|sân bay/.test(s)) return 'city';
  return 'nature';
}
function getTimePeriod(timeStr) {
  const [h, m] = (timeStr || '12:00').split(':').map(Number); const min = h * 60 + (m || 0);
  if (min >= 300 && min < 405) return 'dawn';
  if (min >= 405 && min < 990) return 'day';
  if (min >= 990 && min < 1110) return 'dusk';
  return 'night';
}
function getWeatherMood(code) {
  if (code == null) return 'clear';
  if (code === 0 || code === 1) return 'clear';
  if (code === 2 || code === 3 || code === 45 || code === 48) return 'cloudy';
  if (code >= 51 && code <= 67 || code >= 80 && code <= 82) return 'rain';
  if (code >= 95) return 'thunder';
  return 'cloudy';
}
function getPalette(period, mood) {
  const palettes = {
    dawn: { skyTop:'#4A3B69', skyMid:'#E07A5F', skyBot:'#F4A261', celestial:'#FFE3A8', hillFar:'#5C3D5E', hillNear:'#35223C', accent:'#FFD166' },
    day: { skyTop:'#4EA8DE', skyMid:'#90E0EF', skyBot:'#CAF0F8', celestial:'#FFF3B0', hillFar:'#64B5F6', hillNear:'#1976D2', accent:'#0077B6' },
    dusk: { skyTop:'#2B2D42', skyMid:'#8D0801', skyBot:'#D90429', celestial:'#FFB703', hillFar:'#401F3E', hillNear:'#1F1124', accent:'#FB8500' },
    night: { skyTop:'#050C1A', skyMid:'#0D1B2A', skyBot:'#1B263B', celestial:'#E0E1DD', hillFar:'#1B263B', hillNear:'#0A1118', accent:'#778DA9' }
  };
  let pal = Object.assign({}, palettes[period] || palettes.day);
  if (mood === 'rain' || mood === 'cloudy') {
    pal.skyTop = period === 'night' ? '#091016' : '#6C757D'; pal.skyMid = period === 'night' ? '#141E26' : '#90A4AE';
    pal.skyBot = period === 'night' ? '#1E2D38' : '#CFD8DC'; pal.hillFar = '#455A64'; pal.hillNear = '#263238'; pal.celestial = 'transparent';
  } else if (mood === 'thunder') {
    pal.skyTop = '#190A28'; pal.skyMid = '#32164A'; pal.skyBot = '#4C2068'; pal.hillFar = '#1A092A'; pal.hillNear = '#0E0417'; pal.accent = '#E0AAFF';
  }
  return pal;
}

}
function updateDynamicBackground() {
  const bg = $('#ambient-bg'); if (!bg || !S.trip) return;
  const sit = situation(); const timeStr = fromKey(sit.n).time;
  const curItem = sit.cur || sit.next[0] || (sit.items && sit.items[0]);
  const place = curItem ? (curItem.place || curItem.title) : '';
  const destination = S.trip.destination || S.trip.name || '';
  const period = getTimePeriod(timeStr);
  const mood = getWeatherMood(S.wx && S.wx.cur ? S.wx.cur.code : null);

function shrinkImage(file, max) {
  return new Promise((ok, no) => {
    const img = new Image(), u = URL.createObjectURL(file);
    img.onload = () => {
      const s = max ? Math.min(1, max/Math.max(img.width, img.height)) : Math.min(1, 1400/Math.min(img.width, img.height));
      const c = document.createElement('canvas'); c.width = Math.round(img.width*s); c.height = Math.round(img.height*s);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(u); ok(c.toDataURL('image/jpeg', 0.82).split(',')[1]);
    };
    img.onerror = () => { URL.revokeObjectURL(u); no(new Error('Không đọc được ảnh')); };
    img.src = u;
  });
}
function toast(m) {
  S.toast = m; const el = $('#toast'); if (el) { el.textContent = m; el.hidden = false; }
  clearTimeout(window.toastT); window.toastT = setTimeout(() => { S.toast = ''; const e = $('#toast'); if (e) e.hidden = true; }, 2800);
}

const typing = () => { const a = document.activeElement; return a && (a.tagName==='TEXTAREA' || (a.tagName==='INPUT' && a.type!=='datetime-local') || a.tagName==='SELECT'); };

function render() {
  const app = $('#app'); if (!app) return;
  let h;
  if (S.screen === 'loading') h = `<div class="screen"><div class="card"><div class="sub">Đang định vị và đồng bộ chuyến đi…</div></div></div>`;
  else if (S.screen === 'welcome') h = viewWelcome();
  else if (S.screen === 'upload') h = viewUpload();
  else h = viewLive();

  app.innerHTML = `<div class="wrap">${h}</div>${S.screen==='live'?navBar():''}${S.sheet&&S.screen==='live'?sheetView():''}${S.expForm&&S.screen==='live'?expFormView():''}${S.askName?nameSheet():''}<div class="toast" id="toast" role="status" ${S.toast?'':'hidden'}>${esc(S.toast)}</div>`;
  bind();
  updateDynamicBackground();
}

function hero(sit) {
  const n = fromKey(sit.n), c = sit.cur, nx = sit.next[0];
  const loc = S.loc ? (S.loc.src === 'gps' ? '📍 Theo GPS điện thoại' : '📍 Theo lịch: ' + esc(S.loc.name||'')) : 'Đang lấy vị trí…';
  const meta = `<div class="meta"><span class="clock">${n.time} · ${fmtDate(n.date)}</span><span class="loc">${loc}</span></div>`;
  let body;
  if (c) {
    const p = Math.min(100, Math.max(0, (sit.n - c.s)/(c.e - c.s)*100));
    body = `<span class="label">Đang diễn ra</span><h2>${esc(c.title)}</h2><div class="place">${chip(c.type)}${esc(c.place)}</div>
    <div class="bar"><i style="width:${p.toFixed(1)}%"></i></div>
    <div class="barmeta mono"><span>${c.start}</span><span>còn ${dur(c.e - sit.n)}</span><span>${c.end||fromKey(c.e).time}</span></div>
    <div><button class="btn sm" data-open="${esc(c.id)}">Ghi chú của đoàn (${notesFor(c.id).length})</button></div>`;
  } else if (nx) {
    body = `<span class="label">Hoạt động tiếp theo</span><div class="cd">${cdUnits(nx.s - sit.n)}</div><h2>${esc(nx.title)}</h2><div class="place">${chip(nx.type)}${esc(nx.place)} · lúc <span class="mono">${nx.start}</span></div><div><button class="btn sm" data-open="${esc(nx.id)}">Xem chi tiết</button></div>`;
  } else {
    body = `<span class="label">Kết thúc</span><h2>Chuyến đi đã khép lại</h2>`;
  }
  return `<section class="hero">${meta}${body}</section>`;
}
function cdUnits(min) {
  const s = Math.max(0, Math.floor(min*60)), d = Math.floor(s/86400), h = Math.floor(s%86400/3600), m = Math.floor(s%3600/60);
  return (d ? `<div class="u"><b>${d}</b><span>ngày</span></div>` : '') + `<div class="u"><b>${String(h).padStart(2,'0')}</b><span>giờ</span></div><div class="u"><b>${String(m).padStart(2,'0')}</b><span>phút</span></div>`;
}

function timelinePanel(sit) {
  const days = S.trip.days, today = fromKey(sit.n).date;
  let di = S.dayIdx !== null ? S.dayIdx : days.findIndex(d => d.date === today);
  if (di < 0) di = 0;
  const d = days[di], items = sit.items.filter(x => x.di === di);

  let dayWxBanner = '';
  if (S.wx && S.wx.daily && S.wx.daily[d.date]) {
    const dw = S.wx.daily[d.date];
    dayWxBanner = `<div class="day-weather-banner">
      ${wxIcon(dw.code)}
      <div><b>Dự báo ${fmtDate(d.date)}:</b> ${Math.round(dw.min)}°C – ${Math.round(dw.max)}°C · ${wxText(dw.code)}${dw.rainProb != null ? ` · Mưa ${dw.rainProb}%` : ''}</div>
    </div>`;
  }

  const showNow = d.date === today;
  let rows = '', placed = false;
  const nowRow = `<li class="nowline"><span class="tm">${fromKey(sit.n).time}</span><span class="dot"></span><span class="ln"><span>BÂY GIỜ</span></span></li>`;

  items.forEach(x => {
    const cur = x.s <= sit.n && sit.n < x.e;
    if (showNow && !placed && !cur && x.s > sit.n) { rows += nowRow; placed = true; }
    const nc = notesFor(x.id).length;
    rows += `<li class="ti ${cur ? 'cur' : (x.e <= sit.n ? 'past' : '')}"><button data-open="${esc(x.id)}"><span class="tm">${x.start}</span><span class="dot"></span><span class="bd"><b>${esc(x.title)}</b>${x.src==='ai'?'<span class="tag ai">Sen</span>':''}<span class="pl" style="display:block">${esc(x.place)}${x.end ? ' · đến ' + x.end : ''}${nc ? ' · ' + nc + ' ghi chú' : ''}</span></span></button></li>`;
    if (cur) { rows += nowRow; placed = true; }
  });
  if (showNow && !placed) rows += nowRow;

  return `<section class="panel" id="timeline">
    <header><h3>Dòng thời gian</h3><span class="sub">${esc(d.title||'')}</span></header>
    <div class="tabs">${days.map((x,i) => {
      const dw = S.wx && S.wx.daily ? S.wx.daily[x.date] : null;
      return `<button class="tab" data-day="${i}" aria-pressed="${i===di}">Ngày ${i+1} · ${fmtDate(x.date)}${dw ? ` (${Math.round(dw.max)}°)` : ''}</button>`;
    }).join('')}</div>
    ${dayWxBanner}
    <ol class="tl">${rows}</ol>
  </section>`;
}

/* ==================== BẮT SỰ KIỆN & KHỞI CHẠY ==================== */
function bind() {
  document.querySelectorAll('[data-act]').forEach(b => b.onclick = e => { if (b.classList.contains('scrim') && e.target !== b) return; act(b.dataset.act); });
  document.querySelectorAll('[data-open]').forEach(b => b.onclick = () => { S.sheet = b.dataset.open; render(); });
  document.querySelectorAll('[data-day]').forEach(b => b.onclick = () => { S.dayIdx = +b.dataset.day; render(); });
  document.querySelectorAll('[data-near]').forEach(b => b.onclick = () => { S.nearTab = b.dataset.near; render(); });

  const on = (id, ev, fn) => { const el = $('#'+id); if (el) el.addEventListener(ev, fn); };
  on('simAt', 'change', e => { const v = e.target.value; if (v) { S.simKey = toKey(v.slice(0,10), v.slice(11,16)); softRender(); } });
  on('itin', 'input', e => S.draft = e.target.value);
  on('file', 'change', e => S.files = [...e.target.files]);

  const uploadPhoto = async file => {
    if (!file) return;
    if (!S.name) { S.askName = true; render(); return; }
    const note = prompt('Ghi chú khoảnh khắc cho bức ảnh (để trống nếu không cần):') || '';
    toast('Đang tải ảnh lên Google Drive…');
    try {
      const b64 = await shrinkImage(file, 1600);
      const res = await apiPost({ action: 'photo', id: S.tripId, author: S.name, note, image: { mime: 'image/jpeg', data: b64 } });
      if (!S.photos) S.photos = [];
      S.photos.unshift(res.photo);
      toast('Đã lưu ảnh vào Drive!');
      render();
    } catch(e) { toast('Lỗi tải ảnh: ' + e.message); }
  };
  on('albumCam', 'change', e => uploadPhoto(e.target.files[0]));
  on('albumPick', 'change', async e => { for (const f of e.target.files) await uploadPhoto(f); });
}

async function act(a) {
  switch (a) {
    case 'upload': S.screen = 'upload'; render(); break;
    case 'back': S.screen = S.trip ? 'live' : 'welcome'; render(); break;
    case 'share': navigator.clipboard.writeText(location.href); toast('Đã chép link chuyến đi!'); break;
    case 'name': S.askName = true; render(); break;
    case 'saveName': { const v = ($('#nameInput').value||'').trim(); if (v) { S.name = v; store.set('ht-name', v); S.askName = false; render(); } break; }
    case 'closeSheet': S.sheet = null; render(); break;
    case 'closeExp': S.expForm = null; render(); break;
    case 'realtime': S.simKey = null; softRender(); break;
    case 'nearai': loadNearby(true); break;
    case 'sendNoteAI':
    case 'sendNote': {
      const t = ($('#noteText').value || '').trim();
      if (!t) return;
      if (!S.name) { S.askName = true; render(); return; }
      const isAI = (a === 'sendNoteAI');
      const target = $('#noteFor') ? $('#noteFor').value : 'auto';
      toast(isAI ? 'Sen AI đang phân tích ghi chú và đối chiếu lịch trình…' : 'Đang lưu ghi chú…');
      try {
        const res = await apiPost({ action: 'note', id: S.tripId, itemId: target, itemTitle: 'Chung', author: S.name, text: t, aiAnalyze: isAI });
        if (res.note) S.notes.push(res.note);
        if (res.trip) S.trip = withIds(res.trip);
        const noteInput = $('#noteText'); if (noteInput) noteInput.value = '';
        toast(res.explanation || 'Đã lưu ghi chú thành công!');
        render();
      } catch(err) { toast('Lỗi: ' + err.message); }
      break;
    }
    case 'addExp': S.expForm = { amount: '', currency: 'VND', note: '' }; render(); break;
    case 'saveExp': {
      const amt = Number($('#expAmt').value); if (!amt) { toast('Nhập số tiền hợp lệ'); return; }
      const cur = $('#expCur').value, note = $('#expNote').value;
      const fileInput = $('#expFile'), file = fileInput && fileInput.files[0];
      toast('Đang lưu khoản chi...');
      let imgData = null; if (file) imgData = { mime: 'image/jpeg', data: await shrinkImage(file, 1400) };
      const res = await apiPost({ action: 'expense', id: S.tripId, author: S.name || 'Thành viên', amount: amt, currency: cur, note, image: imgData });
      S.expenses.push(res.expense); S.expForm = null; toast('Đã ghi vào sổ chi phí!'); render(); break;
    }
    case 'batchExp': {
      const folder = prompt('Nhập link thư mục Google Drive chứa các file ảnh/PDF hóa đơn:');
      if (!folder) break;
      toast('Sen AI đang đọc hàng loạt hóa đơn từ Google Drive...');
      try {
        const res = await apiPost({ action: 'batchExpenses', id: S.tripId, author: S.name || 'Trưởng đoàn', folderUrl: folder, timezone: tz() });
        toast(`Đã đọc và lưu thành công ${res.results.length} khoản chi!`);
        boot();
      } catch(err) { toast('Lỗi đọc hóa đơn: ' + err.message); }
      break;
    }
    case 'parse': {
      const author = ($('#creator') && $('#creator').value.trim()) || S.name;
      if (!author) { toast('Vui lòng nhập tên'); return; }
      S.name = author; store.set('ht-name', author);
      S.parse = { state: 'busy', msg: 'Sen đang đọc lịch trình...' }; render();
      try {
        const filesData = [];
        for (const f of S.files) {
          if (f.type.startsWith('image/')) filesData.push({ mime: 'image/jpeg', data: await shrinkImage(f, 1400) });
          else if (f.type === 'application/pdf') {
            const b64 = await new Promise(r => { const reader = new FileReader(); reader.onload = () => r(reader.result.split(',')[1]); reader.readAsDataURL(f); });
            filesData.push({ mime: 'application/pdf', data: b64 });
          }
        }
        const parsed = (await apiPost({ action: 'parse', text: S.draft, files: filesData, author })).trip;
        const saved = await apiPost({ action: 'save', trip: parsed, author });
        S.tripId = saved.id; parsed.id = saved.id; S.trip = parsed;
        history.replaceState(null, '', '?trip=' + encodeURIComponent(saved.id));
        S.screen = 'live'; render();
      } catch(err) { toast('Lỗi phân tích: ' + err.message); S.parse = { state: 'idle' }; render(); }
      break;
    }
  }
}

async function boot() {
  const id = new URLSearchParams(location.search).get('trip');
  if (IS_DEMO) {
    S.trip = withIds({ id: 'demo', name: 'Đà Nẵng – Hội An 3N2Đ', destination: 'Đà Nẵng · Hội An', timezone: 'Asia/Ho_Chi_Minh', days: [
      { date: wallParts(new Date(),'Asia/Ho_Chi_Minh').date, title: 'Ngày 1: Biển Mỹ Khê', items: [
        { start:'07:30', end:'08:45', type:'move', title:'Bay Hà Nội → Đà Nẵng', place:'Sân bay Đà Nẵng', lat:16.0439, lng:108.1994 },
        { start:'10:30', end:'12:00', type:'sight', title:'Dạo chợ Hàn', place:'Chợ Hàn', lat:16.0682, lng:108.2241 },
        { start:'15:30', end:'18:00', type:'activity', title:'Tắm biển Mỹ Khê', place:'Biển Mỹ Khê', lat:16.0544, lng:108.2478 }
      ]}
    ]});
    S.screen = 'live'; render();
    initLocationAndContext();
    return;
  }
  if (!id) { S.screen = 'welcome'; render(); return; }
  S.tripId = id; S.screen = 'loading'; render();
  try {
    const res = await apiGet({ action: 'trip', id });
    S.trip = withIds(res.trip); S.notes = res.notes || []; S.expenses = res.expenses || []; S.photos = res.photos || [];
    S.screen = 'live'; render();
    initLocationAndContext();
  } catch(e) { toast('Không tải được chuyến đi: ' + e.message); S.screen = 'welcome'; render(); }
}

async function initLocationAndContext() {
  const gps = await locate();
  S.loc = (gps && S.simKey === null) ? gps : planLoc(situation());
  softRender();
  loadWeather();
  loadSpotlight();
  loadNearby(false);
}

boot();
setInterval(() => { if (S.screen === 'live') softRender(); }, 1000);
setInterval(() => { if (S.screen === 'live') loadWeather(); }, 30 * 60000);
</script>
